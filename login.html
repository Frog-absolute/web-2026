<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login page</title>
    <link rel="stylesheet" href="css/page_css/login.css">
</head>

<body>
    <div class="login-container">
        <img class="login-img" src="css/images/login_images/login.png" alt="Login">
        <h1>Войти</h1>
        <div class="form-container">
            <div class="input-group">
                <div class="input-label">Электропочта</div>
                <input class="text-input" type="text">
                <div class="input-hint">Введите электропочту</div>
            </div>
            <div class="input-group">
                <div class="input-label">Пароль</div>
                <input class="text-input" type="password">
            </div>
            <button class="submit-btn">Продолжить</button>
        </div>
    </div>
</body>

</html>
