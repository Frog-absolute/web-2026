<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home page</title>
    <link rel="stylesheet" href="css/page_css/home.css">
</head>

<body>
    <header></header>
    <div class="sidebar">
        <div class="sidebar-icon">
            <img src="css/images/home_images/home.png" alt="home">
            <img src="css/images/home_images/dot.png" alt="dot" class="icon-dot">
            <img src="css/images/home_images/user.png" alt="user" class="icon-user">
            <img src="css/images/home_images/plus.png" alt="plus" class="icon-plus">
        </div>
    </div>
    <div class="news-feed">
        <div class="profile profile-top">
            <img src="css/images/home_images/user-1.png" alt="user-1" class="user-avatar">
            <div class="user-name">Ваня Денисов</div>
            <img src="css/images/home_images/edit.png" alt="edit" class="profile-edit">
        </div>
        <div class="post-container">
            <img src="css/images/home_images/post-image.png" alt="post-image" class="post-image">
            <img src="css/images/home_images/Indicator.png" alt="Indicator" class="post-indicator">
        </div>
        <img src="css/images/home_images/like.png" alt="like" class="like-button">
        <div class="post-text">
            Так красиво сегодня на улице! Настоящая зима)) Вспоминается<br>Бродский: «Поздно ночью, в...
        </div>
        <div class="post-time">2 часа назад</div>
        <div class="profile-bottom profile">
            <img src="css/images/home_images/user-2.png" alt="user-2" class="user-avatar">
            <div class="user-name">Лиза Дёмина</div>
            <img src="css/images/home_images/edit.png" alt="edit" class="profile-edit">
        </div>
        <img src="css/images/home_images/post-image-2.png" alt="post-image-2" class="post-image post-image-bottom">
    </div>


</body>

</html>
