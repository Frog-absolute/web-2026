<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>
    <link rel="stylesheet" href="css/page_css/profile.css">
</head>

<body>
    <div class="sidebar">
        <div class="sidebar-icon">
            <img src="css/images/home_images/home.png" alt="home">
            <img src="css/images/home_images/user.png" alt="user" class="icon-user">
            <img src="css/images/home_images/dot.png" alt="dot" class="icon-dot">
            <img src="css/images/home_images/plus.png" alt="plus" class="icon-plus">
        </div>
    </div>
    <div class="profile-info">
        <img src="css/images/profile_images/profile-avatar.png" alt="avatar" class="profile-avatar">
        <div class="profile-name">Ваня Денисов</div>
        <div class="profile-text">Привет! Я системный аналитик в ACME :) Тут моя<br>жизнь только для самых
            классных!</div>
        <img src="css/images/profile_images/post-quantity.png" alt="post-quantity" class="post-quantity">
    </div>
    <div class="grid">
        <img src="css/images/profile_images/profile-image-1.png" alt="image-1">
        <img src="css/images/profile_images/profile-image-2.png" alt="image-2">
        <img src="css/images/profile_images/profile-image-3.png" alt="image-3">
        <img src="css/images/profile_images/profile-image-4.png" alt="image-4">
        <img src="css/images/profile_images/profile-image-5.png" alt="image-5">
        <img src="css/images/profile_images/profile-image-6.png" alt="image-6">
        <img src="css/images/profile_images/profile-image-7.png" alt="image-7">
        <img src="css/images/profile_images/profile-image-8.png" alt="image-8">
        <img src="css/images/profile_images/profile-image-9.png" alt="image-9">
    </div>

</body>

</html>
